name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not use this form. See SECURITY.md and report it privately.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A small `.jmx` file helps. Remove anything private from it first.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
  - type: input
    id: env
    attributes:
      label: Windows, Java and JMeter versions
