name: Feature request
description: Suggest something the app should do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do
      description: Describe the job you are trying to get done, not only the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work
