version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
    ignore:
      # GPUI and Zed's crates are pinned to one commit on purpose.
      - dependency-name: "gpui*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Every step that uses `github/codeql-action` must be on the same version, so these move together.
      code-scanning:
        patterns: ["github/codeql-action*"]
      # Files uploaded by one job are downloaded by another, so these move together too.
      artifacts:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]
