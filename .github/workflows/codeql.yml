name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Code scanning (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"
