name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New advisories appear without any change to the code, so check every week too.
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, test, clippy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Java and JMeter are installed so that the tests that run the real JMeter run here, not just locally.
      - uses: ./.github/actions/setup-jmeter
      - run: cargo build --locked -p jmeter-ui
      - run: cargo test --locked --workspace --exclude gpui-spike --exclude zed-ui-spike
      - run: cargo clippy --locked --workspace --exclude gpui-spike --exclude zed-ui-spike --all-targets -- -D warnings

  # The app is written to run on Linux and macOS too, but only Windows has been used so far. These jobs find out
  # what does not work there. They report but do not block a merge yet; make them required once they are green.
  cross-platform:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the window toolkit (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang pkg-config libfontconfig-dev libasound2-dev libssl-dev libzstd-dev             libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libxcb-xkb-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-jmeter
      - run: cargo build --locked -p jmeter-ui
      # --no-fail-fast: one run lists every failure on this system, not only the first.
      - run: cargo test --locked --no-fail-fast --workspace --exclude gpui-spike --exclude zed-ui-spike

  supply-chain:
    name: Advisories, licences, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs `cargo deny check`: known vulnerabilities, allowed licences, allowed code sources (deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@v2
