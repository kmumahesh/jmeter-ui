[package]
name = "jmeter-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
default-run = "jmeter-ui"

[lib]
name = "jmeter_ui"
path = "src/lib.rs"

[[bin]]
name = "jmeter-ui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "fb69067729cb16a7f6135e2c1600c26a28c59659" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "fb69067729cb16a7f6135e2c1600c26a28c59659" }
jvm-runtime = { path = "../jvm-runtime" }
menu = { git = "https://github.com/zed-industries/zed", rev = "fb69067729cb16a7f6135e2c1600c26a28c59659" }
jmx-model = { path = "../jmx-model" }
plan-core = { path = "../plan-core" }
rust-embed = { version = "8", features = ["include-exclude"] }
serde_json = "1"
shell-core = { path = "../shell-core" }
theme = { git = "https://github.com/zed-industries/zed", rev = "fb69067729cb16a7f6135e2c1600c26a28c59659" }
ui = { git = "https://github.com/zed-industries/zed", rev = "fb69067729cb16a7f6135e2c1600c26a28c59659" }

[build-dependencies]
resvg = { version = "0.46", default-features = false }
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[dev-dependencies]
resvg = { version = "0.46", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "fb69067729cb16a7f6135e2c1600c26a28c59659", features = ["test-support"] }
