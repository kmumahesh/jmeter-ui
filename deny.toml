# Checks run by `cargo deny check` (also in CI): known vulnerabilities, licences, and where code comes from.

[graph]
all-features = true

[advisories]
# Vulnerabilities always fail. These crates are only reported as no longer maintained and come in through
# GPUI and Zed's crates, which this project cannot change; review the list when GPUI is updated.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, used by GPUI" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, used by GPUI through usvg" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, used by GPUI" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, Linux only, used by GPUI" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, Linux only, used by GPUI" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, Linux only, used by GPUI" },
]

[licenses]
# The project is GPL-3.0-or-later, so permissive licences and the GPL family can be combined with it.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Code that GPUI and Zed's crates take from git, each pinned to one commit by `Cargo.lock`.
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/zed-industries/calloop",
    "https://github.com/zed-industries/scap", # macOS only, so not seen when checking on Windows
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/smol-rs/async-task",
    "https://github.com/proptest-rs/proptest",
]
